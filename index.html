<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Transcriber</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }
        .upload-area:hover { background: #f0f3ff; border-color: #764ba2; }
        .upload-area.dragover { background: #e8ebff; border-color: #764ba2; }
        .upload-icon { font-size: 48px; margin-bottom: 15px; }
        .upload-text { color: #333; font-weight: 600; margin-bottom: 5px; }
        .upload-subtext { color: #999; font-size: 13px; }
        input[type="file"] { display: none; }
        .controls { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn {
            flex: 1; padding: 12px 20px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer; min-width: 120px;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #f0f3ff; color: #667eea; border: 2px solid #667eea; }
        .progress-container { display: none; margin-top: 30px; }
        .progress-container.show { display: block; }
        .progress-label { color: #333; font-weight: 600; margin-bottom: 10px; font-size: 14px; }
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); width: 0%; transition: width 0.3s ease; }
        .result-container { display: none; margin-top: 30px; }
        .result-container.show { display: block; }
        .result-text { background: #f8f9ff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; min-height: 100px; max-height: 300px; overflow-y: auto; margin-top: 10px; }
        .file-info { background: #f0f3ff; border-left: 4px solid #667eea; padding: 12px; border-radius: 4px; margin-top: 20px; font-size: 13px; }
        .error { background: #fee; border-left: 4px solid #e74c3c; padding: 12px; border-radius: 4px; color: #c0392b; margin-top: 20px; font-size: 13px; }
        .success { background: #efe; border-left: 4px solid #27ae60; padding: 12px; border-radius: 4px; color: #229954; margin-top: 20px; font-size: 13px; }
        .download-buttons { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Audio Transcriber</h1>
        <p class="subtitle">Загрузи аудиофайл → Получи текст (локально в браузере)</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Перетащи аудиофайл сюда</div>
            <div class="upload-subtext">или нажми, чтобы выбрать</div>
        </div>
        <input type="file" id="audioFile" accept="audio/*">

        <div class="controls">
            <button class="btn btn-primary" id="transcribeBtn" disabled>Начать транскрипцию</button>
            <button class="btn btn-secondary" id="clearBtn">Очистить</button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-label" id="progressText">Обработка...</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <div id="fileInfo"></div>
        <div id="messageBox"></div>

        <div class="result-container" id="resultContainer">
            <div style="font-weight:600;">Результат транскрипции:</div>
            <div class="result-text" id="resultText"></div>
            <div class="download-buttons">
                <button class="btn btn-secondary" id="downloadTxtBtn">📥 TXT</button>
                <button class="btn btn-secondary" id="copyBtn">📋 Копировать</button>
            </div>
        </div>
    </div>

    <script type="module">
        let audioFile = null;
        let worker = null;

        const uploadArea = document.getElementById('uploadArea');
        const audioFileInput = document.getElementById('audioFile');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        const fileInfo = document.getElementById('fileInfo');
        const messageBox = document.getElementById('messageBox');

        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        uploadArea.addEventListener('click', () => audioFileInput.click());
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files[0]);
        });

        audioFileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFiles(e.target.files[0]);
        });

        function handleFiles(file) {
            audioFile = file;
            fileInfo.innerHTML = `<div class="file-info">📎 <b>${file.name}</b> (${(file.size / 1024 / 1024).toFixed(2)} MB)</div>`;
            transcribeBtn.disabled = false;
            messageBox.innerHTML = '';
            resultContainer.classList.remove('show');
        }

        // Функция ресемплирования аудио в 16000 Гц
        function resampleTo16kHz(audioBuffer) {
            const numChannels = 1; // Берем моно
            const sampleRate = 16000;
            const offlineCtx = new OfflineAudioContext(numChannels, audioBuffer.duration * sampleRate, sampleRate);
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start(0);
            return offlineCtx.startRendering();
        }

        async function transcribe() {
            if (!audioFile) return;

            transcribeBtn.disabled = true;
            progressContainer.classList.add('show');
            progressText.textContent = 'Чтение файла...';
            progressFill.style.width = '10%';

            try {
                // 1. Инициализируем AudioContext строго при клике
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const audioContext = new AudioCtx();
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                progressText.textContent = 'Декодирование аудио...';
                progressFill.style.width = '25%';

                // 2. Безопасное чтение файла
                const arrayBuffer = await audioFile.arrayBuffer();
                const decodedAudio = await audioContext.decodeAudioData(arrayBuffer.slice(0));

                progressText.textContent = 'Подготовка к распознаванию...';
                progressFill.style.width = '40%';

                // 3. Приводим аудио к 16000Hz (требование Whisper)
                const resampledBuffer = await resampleTo16kHz(decodedAudio);
                const audioData = resampledBuffer.getChannelData(0);

                // Закрываем контекст, чтобы освободить память
                audioContext.close();

                // 4. Запускаем воркер
                if (!worker) {
                    worker = new Worker('worker.js', { type: 'module' });
                }

                worker.onmessage = (e) => {
                    const { status, message, text, error } = e.data;

                    if (status === 'loading') {
                        progressText.textContent = message;
                        progressFill.style.width = '55%';
                    } else if (status === 'processing') {
                        progressText.textContent = message;
                        progressFill.style.width = '75%';
                    } else if (status === 'complete') {
                        progressFill.style.width = '100%';
                        progressText.textContent = '✓ Готово!';
                        resultText.textContent = text;
                        resultContainer.classList.add('show');
                        showMessage('✓ Транскрипция завершена!', 'success');
                        setTimeout(() => progressContainer.classList.remove('show'), 1000);
                        transcribeBtn.disabled = false;
                    } else if (status === 'error') {
                        showMessage(`Ошибка: ${error}`, 'error');
                        progressContainer.classList.remove('show');
                        transcribeBtn.disabled = false;
                    }
                };

                // Отправляем Float32Array воркеру
                worker.postMessage({ audioData });

            } catch (err) {
                console.error(err);
                showMessage(`Ошибка декодирования: ${err.message}. Попробуйте файл другого формата (WAV или MP3).`, 'error');
                progressContainer.classList.remove('show');
                transcribeBtn.disabled = false;
            }
        }

        function showMessage(text, type) {
            messageBox.innerHTML = `<div class="${type}">${text}</div>`;
        }

        transcribeBtn.addEventListener('click', transcribe);
        clearBtn.addEventListener('click', () => {
            audioFile = null;
            audioFileInput.value = '';
            fileInfo.innerHTML = '';
            messageBox.innerHTML = '';
            resultContainer.classList.remove('show');
            progressContainer.classList.remove('show');
            transcribeBtn.disabled = true;
        });

        document.getElementById('downloadTxtBtn').addEventListener('click', () => {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(resultText.textContent));
            element.setAttribute('download', `transcription_${Date.now()}.txt`);
            element.click();
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(resultText.textContent).then(() => showMessage('✓ Скопировано!', 'success'));
        });
    </script>
</body>
</html>
